services:
  data:
    build: .
    command: [python, -m, uvicorn, 'app:app', --app-dir, election-data-server, --host, 0.0.0.0, --port, '8101']
    environment:
      DATA_DIR: /state/data
      DATA_MODE: hybrid
    volumes: [data-state:/state/data]
    ports: ['127.0.0.1:8101:8101']
    restart: unless-stopped
  news:
    build: .
    depends_on: [data]
    environment:
      NEWS_DIR: /state/news
      UPSTREAM_URL: http://data:8101
      ALLOW_DEMO_FALLBACK: '1'
    volumes: [news-state:/state/news]
    ports: ['127.0.0.1:8102:8102']
    restart: unless-stopped
volumes:
  data-state:
  news-state:
